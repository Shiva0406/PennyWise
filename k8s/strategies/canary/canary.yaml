apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-stable
  namespace: splitwise
spec:
  replicas: 9
  selector:
    matchLabels: {app: canary-demo}
  template:
    metadata:
      labels: {app: canary-demo, track: stable}
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0.0
          args: ["-text=stable release"]
          ports: [{containerPort: 5678}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-new
  namespace: splitwise
spec:
  replicas: 1
  selector:
    matchLabels: {app: canary-demo, track: canary}
  template:
    metadata:
      labels: {app: canary-demo, track: canary}
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0.0
          args: ["-text=canary release"]
          ports: [{containerPort: 5678}]
---
apiVersion: v1
kind: Service
metadata:
  name: canary-live
  namespace: splitwise
spec:
  selector: {app: canary-demo}
  ports:
    - port: 80
      targetPort: 5678
